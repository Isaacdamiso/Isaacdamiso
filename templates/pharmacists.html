{% extends 'base.html' %}

{% block content %}
<h2>Pharmacists</h2>

<!-- Search Form -->
<form method="get" class="row g-3 mb-4">
  <div class="col-md-4">
    <input name="search" class="form-control" placeholder="Search by name, license, or phone..." value="{{ search_query }}">
  </div>
  <div class="col-md-4">
    <select name="department" class="form-select">
      <option value="">All Departments</option>
      {% for dept in departments %}
        <option value="{{ dept.id }}" {% if dept.id|string == search_dept %}selected{% endif %}>{{ dept.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <button type="submit" class="btn btn-outline-secondary w-100">Search</button>
    <a href="{{ url_for('main.pharmacists') }}" class="btn btn-outline-info w-100 mt-2">Clear</a>
  </div>
</form>

<!-- Add Pharmacist Form -->
<form method="post" class="row g-3 mb-4">
  <div class="col-md-3">
    <input name="name" class="form-control" placeholder="Pharmacist name" required>
  </div>
  <div class="col-md-2">
    <input name="license_number" class="form-control" placeholder="License #" required>
  </div>
  <div class="col-md-2">
    <input name="phone" class="form-control" placeholder="Phone">
  </div>
  <div class="col-md-2">
    <select name="department_id" class="form-select">
      <option value="">Select Department</option>
      {% for dept in departments %}
        <option value="{{ dept.id }}">{{ dept.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <button class="btn btn-primary">Add Pharmacist</button>
  </div>
</form>

<table class="table table-striped">
  <thead><tr><th>ID</th><th>Name</th><th>License #</th><th>Department</th><th>Phone</th></tr></thead>
  <tbody>
    {% for p in pharmacists %}
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.license_number }}</td>
        <td>{{ p.department.name if p.department else '' }}</td>
        <td>{{ p.phone or '' }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5">No pharmacists</td></tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
